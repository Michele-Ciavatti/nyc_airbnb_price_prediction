# tutorial: https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # Preserves hard linebreaks in .md files
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: name-tests-test
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Excludes lockfiles, notebook outputs, or mock test data
        exclude: '(poetry\.lock|uv\.lock|package-lock\.json|\.ipynb)'

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: readme-tree
        name: Update README project tree
        entry: python scripts/update_readme_tree.py
        language: python
        pass_filenames: false
        always_run: true

# install with:       pre-commit install
# run a check with:   pre-commit run --all-files
