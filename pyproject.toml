[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-airbnb"
version = "0.1.0"
description = "NYC Airbnb price prediction"
authors = [
  { name = "Michele Ciavatti", email = "micheleciavatti@outlook.it" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "kagglehub",
    "python-dotenv",
]

[project.urls]
Repository = "https://github.com/Michele-Ciavatti/nyc_airbnb_price_prediction"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "detect-secrets",
    "nbstripout",
]

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
